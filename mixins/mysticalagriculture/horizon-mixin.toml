[mod]
id = "mysticalagriculture"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure inferium rules (age/ripeness and the jar's drop formula), injected
# as `crate::game::mysticalagriculture`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mysticalagriculture"
source = "runtime.rs"

# Game-side glue: the block/level reads the drop formula needs and the
# bone-meal answer.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "mysticalagriculture_state"
source = "support.rs"

# The content half is inside this bundle (`data/mysticalagriculture-content.hmod`, the built
# `content/mysticalagriculture.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the crop, its items and the code. The registry keeps one
# file per project, so a split port could not be listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# A broken crop drops the jar's essence and seeds (the farmland under it
# decides the tier), not the rolled table's plain-farmland fallback.
[[injection]]
id = "loot-drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&crate::game::native_hooks::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "drops" },
]

# Bone meal never grows a Mystical Agriculture crop.
[[injection]]
id = "bonemeal-target"
hook = "is_valid_bonemeal_target"
hook_version = 1
kind = "HEAD"
helper = "bonemeal_target.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "valid", ty = "&mut Option<bool>", value = "valid" },
]

[[injection]]
id = "bonemeal-success"
hook = "is_bonemeal_success"
hook_version = 1
kind = "HEAD"
helper = "bonemeal_success.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "success", ty = "&mut bool", value = "success" },
]
